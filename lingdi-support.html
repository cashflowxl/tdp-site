<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>领地｜在线咨询</title>
  <link rel="stylesheet" href="/lingdi-ui.css">
  <link rel="stylesheet" href="/lingdi-vivid.css">
  <link rel="stylesheet" href="/lingdi-public-nav.css">
  <style>
    [hidden]{display:none!important}.support-hero{padding:72px 0 42px;background:linear-gradient(145deg,#fff,#faf7ef)}.support-hero h1{margin:10px 0;font-size:clamp(34px,4vw,54px);letter-spacing:-.05em}.support-hero p{margin:0;color:var(--muted);line-height:1.7}.chat{max-width:880px;margin:0 auto}.chat-shell{padding:0;overflow:hidden}.chat-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.presence{font-size:12px;color:#257647;font-weight:700}.presence:before{content:'';display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:#52bd76}.chat-log{height:min(52vh,520px);overflow:auto;padding:20px;background:#f7f8fa}.bubble{max-width:80%;padding:11px 13px;margin:10px 0;border-radius:15px;background:#fff;border:1px solid var(--line);font-size:14px;line-height:1.65;white-space:pre-wrap}.bubble.customer{margin-left:auto;background:#fff4e2;border-color:#f2ce98}.bubble .meta{display:block;margin-bottom:4px;color:var(--muted);font-size:11px}.composer{padding:16px 20px;border-top:1px solid var(--line);background:#fff}.composer textarea{width:100%;min-height:76px;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;resize:vertical}.composer-row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px}.setup{padding:28px}.setup .fields{margin-top:14px}.status{font-size:13px;color:var(--muted)}.submission-note{margin-top:14px;padding:12px 14px;border-left:3px solid #d99c24;background:#fff8e9;color:var(--muted);font-size:12px;line-height:1.65}.submission-note a{text-decoration:underline;text-underline-offset:2px}@media(max-width:640px){.support-hero{padding-top:52px}.chat-log{height:48vh}.bubble{max-width:91%}.chat-head,.composer{padding:14px}}
  </style>
</head>
<body>
  <nav class="nav"></nav>
  <main>
    <section class="support-hero"><div class="wrap"><div class="kicker" id="supportKicker">LINGDI ONLINE SUPPORT</div><h1 id="supportTitle">在线咨询<br>需要时转人工</h1><p id="supportSubtitle">AI 先接待常见问题；复杂需求、付款、退款与交付由人工确认。</p></div></section>
    <section class="section"><div class="wrap chat"><article class="panel chat-shell" id="setup"><div class="setup"><h2 id="setupTitle">开始咨询</h2><p class="muted" id="setupCopy">留下一个方便联系的方式，即可开始站内对话。</p><div class="fields"><div class="field"><label for="contact">联系方式</label><input id="contact" placeholder="邮箱、QQ 或微信号"></div><div class="field"><label for="category">咨询类型</label><select id="category"><option>服务咨询</option><option>GEO 诊断与服务</option><option>GEO 合作伙伴</option><option>订单进度</option><option>付款核对</option></select></div><div class="field" id="partnerTypeField" hidden><label for="partnerType">合作方式</label><select id="partnerType"><option>客户引荐</option><option>联合销售</option><option>联合交付</option><option>活动与培训</option><option>其他合作</option></select></div><div class="field wide" id="orderField"><label for="orderId">订单号（可选）</label><input id="orderId" placeholder="例如 LD-20260812-XXXX"></div><div class="field wide"><label for="firstMessage">想咨询什么？</label><textarea id="firstMessage" placeholder="请简要描述你的问题。"></textarea></div></div><p class="submission-note">点击“开始在线咨询”后，联系方式和以上内容会提交给领地客服系统，用于本次沟通。请勿提交密码、验证码、订单明细、许可证原件或商业秘密。详见 <a href="/lingdi-privacy.html">隐私说明</a>。</p><button id="start" class="button">开始在线咨询</button><p id="setupStatus" class="status"></p></div></article><article class="panel chat-shell" id="chat" hidden><div class="chat-head"><div><b id="chatBrand">领地在线咨询</b><div class="presence" id="presence">AI 接待中</div></div><button id="transfer" class="button light">转人工顾问</button></div><div id="chatLog" class="chat-log" aria-live="polite"></div><div class="composer"><textarea id="message" placeholder="输入消息。请勿发送密码、验证码或登录凭据。"></textarea><div class="composer-row"><span class="status" id="status">回复会自动显示。</span><button id="send" class="button">发送</button></div></div></article></div></section>
  </main>
  <script>
    (function(){
      const api=window.LINGDI_API_BASE||'https://api.terradigitalpower.com';const $=s=>document.querySelector(s);const params=new URLSearchParams(location.search);const source=params.get('source')||'';const geoSource=source.indexOf('geo')===0;const partnerSource=source==='geo-partner';const diagnosisSource=geoSource&&!partnerSource;const chatIdKey=partnerSource?'lingdi_partner_chat_id':diagnosisSource?'lingdi_diagnosis_chat_id':'lingdi_chat_id';const chatContactKey=partnerSource?'lingdi_partner_chat_contact':diagnosisSource?'lingdi_diagnosis_chat_contact':'lingdi_chat_contact';let id=sessionStorage.getItem(chatIdKey)||'',contact=sessionStorage.getItem(chatContactKey)||'',timer;
      const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      async function get(){const r=await fetch(api+'/api/public/conversations/'+encodeURIComponent(id)+'?contact='+encodeURIComponent(contact));const d=await r.json();if(!r.ok)throw new Error(d.error||'读取失败');return d}
      function render(d){$('#presence').textContent=d.conversation.status;$('#chatLog').innerHTML=d.messages.map(m=>`<div class="bubble ${m.sender==='customer'?'customer':''}"><span class="meta">${m.sender==='customer'?'你':m.sender==='agent'?'人工技术支持':'领地 AI 助手'}</span>${esc(m.content)}</div>`).join('');$('#chatLog').scrollTop=$('#chatLog').scrollHeight}
      async function refresh(silent=true){if(!id)return;try{render(await get());if(!silent)$('#status').textContent='会话已更新。'}catch(e){$('#status').textContent='连接异常：'+e.message}}
      async function send(){const content=$('#message').value.trim();if(!content)return;$('#send').disabled=true;try{const r=await fetch(api+'/api/public/conversations/'+encodeURIComponent(id)+'/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contact,content})});const d=await r.json();if(!r.ok)throw new Error(d.error||'发送失败');$('#message').value='';await refresh(false)}catch(e){$('#status').textContent='发送失败：'+e.message}finally{$('#send').disabled=false}}
      async function start(){contact=$('#contact').value.trim();let content=$('#firstMessage').value.trim();if(!contact||!content){$('#setupStatus').textContent='请填写联系方式和咨询内容。';return}if(partnerSource)content='合作方式：'+$('#partnerType').value+'\n\n'+content;$('#start').disabled=true;try{const r=await fetch(api+'/api/public/conversations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contact,content,category:$('#category').value,orderId:$('#orderId').value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'创建失败');id=d.id;sessionStorage.setItem(chatIdKey,id);sessionStorage.setItem(chatContactKey,contact);$('#setup').hidden=true;$('#chat').hidden=false;await refresh();timer=setInterval(refresh,4000)}catch(e){$('#setupStatus').textContent='创建失败：'+e.message}finally{$('#start').disabled=false}}
      if(diagnosisSource){document.body.dataset.lingdiNav='geo';document.title='领地 GEO｜申请人工复核';$('#supportKicker').textContent='LINGDI GEO · HUMAN REVIEW';$('#supportTitle').innerHTML='申请完整报告<br>先由顾问复核';$('#supportSubtitle').textContent='把在线预诊断带给顾问，再核对业务目标、原始证据和 AI 回答，形成可追溯的完整报告。';$('#setupTitle').textContent='申请 GEO 人工复核';$('#setupCopy').textContent='填写联系方式并检查预诊断摘要，提交后由顾问继续沟通。';$('#category').value='GEO 诊断与服务';$('#orderField').hidden=true;$('#chatBrand').textContent='领地 GEO 顾问';const summary=sessionStorage.getItem('lingdi_geo_diagnosis_summary');if(summary)$('#firstMessage').value='我已完成在线预诊断，希望申请完整报告。\n\n'+summary;}
      if(partnerSource){document.body.dataset.lingdiNav='geo';document.title='领地 GEO｜申请渠道合作';$('#supportKicker').textContent='LINGDI GEO · CHANNEL PARTNERSHIP';$('#supportTitle').innerHTML='申请渠道合作<br>先从一个项目开始';$('#supportSubtitle').textContent='选择希望参与的合作方式，简要介绍所在行业、可连接的客户或专业能力。双方确认边界后，再从单个项目试跑。';$('#setupTitle').textContent='申请 GEO 渠道合作';$('#setupCopy').textContent='先留下联系方式与资源概况。我们不会要求预付资格费，也不会在核算前承诺固定分配比例。';$('#category').value='GEO 合作伙伴';$('#partnerTypeField').hidden=false;$('#orderField').hidden=true;$('#chatBrand').textContent='领地 GEO 渠道合作';$('#firstMessage').value='我希望了解领地 GEO 渠道合作。\n\n所在城市 / 行业：\n可连接的客户类型或资源：\n希望参与的环节：';}
      $('#start').onclick=start;$('#send').onclick=send;$('#message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#transfer').onclick=async()=>{if(!id)return;try{const r=await fetch(api+'/api/public/conversations/'+encodeURIComponent(id)+'/handoff',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contact})});const d=await r.json();if(!r.ok)throw new Error(d.error||'转人工失败');$('#status').textContent='已请求人工顾问接管，回复会在此显示。';await refresh(false)}catch(e){$('#status').textContent='请求失败：'+e.message}};if(id&&contact){$('#setup').hidden=true;$('#chat').hidden=false;refresh();timer=setInterval(refresh,4000)}})();
  </script>
  <script src="/lingdi-public-nav.js"></script>
</body>
</html>
