<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>领地 AI｜订单查询</title><link rel="stylesheet" href="/lingdi-ui.css"><link rel="stylesheet" href="/lingdi-vivid.css"></head><body><div class="notice">订单查询原型 · 正式版将由订单服务提供受控查询</div><nav class="nav"><div class="wrap"><a class="brand" href="/lingdi-store.html"><b class="logo">AI</b>领地 AI <small>AI 应用服务</small></a><div class="links"><a href="/lingdi-store.html#products">服务方案</a><a href="/lingdi-partner.html">渠道合作</a><a href="/lingdi-support.html">售后工单</a></div><a class="button" href="/lingdi-store.html">返回首页</a></div></nav><main><section class="hero"><div class="wrap"><div class="kicker">ORDER LOOKUP</div><h1>查询订单进度，<br>不必反复问客服。</h1><p class="sub">正式上线后，客户凭下单邮箱、订单查询密码及可选订单编号查询付款核对、履约、售后及退款状态；不会展示敏感账号信息。</p></div></section><section class="section"><div class="wrap grid"><article class="panel form"><h2>查询订单</h2><p>当前为交互演示，不会发送或核验任何数据。</p><div class="fields"><div class="field wide"><label>下单邮箱</label><input type="email" placeholder="例如：name@example.com"></div><div class="field wide"><label>订单查询密码</label><input type="password" placeholder="仅用于正式订单查询"></div><div class="field wide"><label>订单编号（可选）</label><input placeholder="例如：LD-20260812-0001"></div></div><button id="lookup" class="button">查询订单（演示）</button></article><aside class="panel"><div id="result" class="empty">填写查询信息后，订单状态将在这里展示。<br><br>未来包含：付款核对、履约进度、交付记录、售后工单和退款状态。</div></aside></div></section></main><footer class="footer"><div class="wrap"><span><b>领地 AI</b> · 订单查询</span><span>严禁输入账号密码、验证码、Cookie、Session 或令牌</span></div></footer><script>document.getElementById('lookup').onclick=()=>document.getElementById('result').innerHTML='<span class="status warn">演示订单</span><h3>LD-20260812-0001</h3><p>状态：待付款核对</p><p>正式版将按权限显示真实进度；当前未创建或读取任何订单。</p>';</script></body></html>
