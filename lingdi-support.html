<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>领地 AI｜技术支持</title>
  <link rel="stylesheet" href="/lingdi-ui.css">
  <link rel="stylesheet" href="/lingdi-vivid.css">
  <link rel="stylesheet" href="/lingdi-public-nav.css">
  <style>
    .support-hero{padding:72px 0 42px;background:linear-gradient(145deg,#fff,#faf7ef)}.support-hero h1{margin:10px 0;font-size:clamp(34px,4vw,54px);letter-spacing:-.05em}.support-hero p{margin:0;color:var(--muted);line-height:1.7}.chat{max-width:880px;margin:0 auto}.chat-shell{padding:0;overflow:hidden}.chat-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.presence{font-size:12px;color:#257647;font-weight:700}.presence:before{content:'';display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:#52bd76}.chat-log{height:min(52vh,520px);overflow:auto;padding:20px;background:#f7f8fa}.bubble{max-width:80%;padding:11px 13px;margin:10px 0;border-radius:15px;background:#fff;border:1px solid var(--line);font-size:14px;line-height:1.65;white-space:pre-wrap}.bubble.customer{margin-left:auto;background:#fff4e2;border-color:#f2ce98}.bubble .meta{display:block;margin-bottom:4px;color:var(--muted);font-size:11px}.composer{padding:16px 20px;border-top:1px solid var(--line);background:#fff}.composer textarea{width:100%;min-height:76px;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;resize:vertical}.composer-row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px}.setup{padding:28px}.setup .fields{margin-top:14px}.status{font-size:13px;color:var(--muted)}@media(max-width:640px){.support-hero{padding-top:52px}.chat-log{height:48vh}.bubble{max-width:91%}.chat-head,.composer{padding:14px}}
  </style>
</head>
<body>
  <nav class="nav"></nav>
  <main>
    <section class="support-hero"><div class="wrap"><div class="kicker">LINGDI TECHNICAL SUPPORT</div><h1>技术支持<br>需要时转人工</h1><p>AI 先接待常见问题；付款、退款、交付及复杂问题由技术支持人工确认。</p></div></section>
    <section class="section"><div class="wrap chat"><article class="panel chat-shell" id="setup"><div class="setup"><h2>开始咨询</h2><p class="muted">留下一个方便联系的方式，即可开始站内对话。</p><div class="fields"><div class="field"><label for="contact">联系方式</label><input id="contact" placeholder="邮箱、QQ 或微信号"></div><div class="field"><label for="category">咨询类型</label><select id="category"><option>服务咨询</option><option>订单进度</option><option>付款核对</option><option>合伙人资格</option><option>GEO / FDE 需求咨询</option></select></div><div class="field wide"><label for="orderId">订单号（可选）</label><input id="orderId" placeholder="例如 LD-20260812-XXXX"></div><div class="field wide"><label for="firstMessage">想咨询什么？</label><textarea id="firstMessage" placeholder="请简要描述你的问题。"></textarea></div></div><button id="start" class="button">开始在线咨询</button><p id="setupStatus" class="status"></p></div></article><article class="panel chat-shell" id="chat" hidden><div class="chat-head"><div><b>领地 AI 在线咨询</b><div class="presence" id="presence">AI 接待中</div></div><button id="transfer" class="button light">转人工技术支持</button></div><div id="chatLog" class="chat-log" aria-live="polite"></div><div class="composer"><textarea id="message" placeholder="输入消息。请勿发送密码、验证码或登录凭据。"></textarea><div class="composer-row"><span class="status" id="status">技术支持回复会自动显示。</span><button id="send" class="button">发送</button></div></div></article></div></section>
  </main>
  <script>
    (function(){
      const api=window.LINGDI_API_BASE||'https://api.terradigitalpower.com';const $=s=>document.querySelector(s);let id=sessionStorage.getItem('lingdi_chat_id')||'',contact=sessionStorage.getItem('lingdi_chat_contact')||'',timer;
      const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      async function get(){const r=await fetch(api+'/api/public/conversations/'+encodeURIComponent(id)+'?contact='+encodeURIComponent(contact));const d=await r.json();if(!r.ok)throw new Error(d.error||'读取失败');return d}
      function render(d){$('#presence').textContent=d.conversation.status;$('#chatLog').innerHTML=d.messages.map(m=>`<div class="bubble ${m.sender==='customer'?'customer':''}"><span class="meta">${m.sender==='customer'?'你':m.sender==='agent'?'人工技术支持':'领地 AI 助手'}</span>${esc(m.content)}</div>`).join('');$('#chatLog').scrollTop=$('#chatLog').scrollHeight}
      async function refresh(silent=true){if(!id)return;try{render(await get());if(!silent)$('#status').textContent='会话已更新。'}catch(e){$('#status').textContent='连接异常：'+e.message}}
      async function send(){const content=$('#message').value.trim();if(!content)return;$('#send').disabled=true;try{const r=await fetch(api+'/api/public/conversations/'+encodeURIComponent(id)+'/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contact,content})});const d=await r.json();if(!r.ok)throw new Error(d.error||'发送失败');$('#message').value='';await refresh(false)}catch(e){$('#status').textContent='发送失败：'+e.message}finally{$('#send').disabled=false}}
      async function start(){contact=$('#contact').value.trim();const content=$('#firstMessage').value.trim();if(!contact||!content){$('#setupStatus').textContent='请填写联系方式和咨询内容。';return}$('#start').disabled=true;try{const r=await fetch(api+'/api/public/conversations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contact,content,category:$('#category').value,orderId:$('#orderId').value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'创建失败');id=d.id;sessionStorage.setItem('lingdi_chat_id',id);sessionStorage.setItem('lingdi_chat_contact',contact);$('#setup').hidden=true;$('#chat').hidden=false;await refresh();timer=setInterval(refresh,4000)}catch(e){$('#setupStatus').textContent='创建失败：'+e.message}finally{$('#start').disabled=false}}
      $('#start').onclick=start;$('#send').onclick=send;$('#message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#transfer').onclick=async()=>{if(!id)return;try{const r=await fetch(api+'/api/public/conversations/'+encodeURIComponent(id)+'/handoff',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contact})});const d=await r.json();if(!r.ok)throw new Error(d.error||'转人工失败');$('#status').textContent='已请求人工技术支持接管，回复会在此显示。';await refresh(false)}catch(e){$('#status').textContent='请求失败：'+e.message}};if(id&&contact){$('#setup').hidden=true;$('#chat').hidden=false;refresh();timer=setInterval(refresh,4000)}})();
  </script>
  <script src="/lingdi-public-nav.js"></script>
</body>
</html>
