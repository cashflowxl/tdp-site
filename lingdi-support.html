<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>领地 AI｜在线咨询与售后</title><link rel="stylesheet" href="/lingdi-ui.css"><link rel="stylesheet" href="/lingdi-vivid.css"><style>.chat{max-width:760px;margin:0 auto}.chat-log{min-height:170px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fafafa;margin:16px 0}.bubble{max-width:86%;padding:11px 13px;margin:9px 0;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:14px}.bubble.system{margin-left:auto;background:#fff4e2;border-color:#f2ce98}.field select,.field textarea{width:100%}.field textarea{min-height:130px;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.ticket-created{display:none}.ticket-created.show{display:block}</style></head>
<body><div class="notice"><b>在线咨询与售后</b> · 提交后进入运营后台工单队列，由人工客服处理。</div><nav class="nav"><div class="wrap"><a class="brand" href="/"><b class="logo">LD</b>领地 AI <small>AI 商业应用落地服务商</small></a><div class="links"><a href="/lingdi-live-test.html">创建订单</a><a href="/lingdi-live-orders.html">订单查询</a></div><a class="button" href="/">返回官网</a></div></nav><main><section class="hero"><div class="wrap"><div class="kicker">LINGDI SUPPORT</div><h1>在线留下问题，<br>由人工客服跟进。</h1><p class="sub">这是工单式咨询窗口：提交的内容会进入后台售后队列。它不是即时人工聊天，不会自动回复或处理付款。</p></div></section><section class="section"><div class="wrap chat"><article class="panel form"><h2>联系客服</h2><div class="chat-log" id="chatLog"><div class="bubble">你好，请说明你的服务、订单或合伙人问题。请勿发送密码、验证码、Cookie、Session 或令牌。</div></div><div class="fields"><div class="field wide"><label for="category">咨询类型</label><select id="category"><option>售后咨询</option><option>订单进度</option><option>付款核对</option><option>合伙人资格</option><option>GEO / FDE 需求咨询</option></select></div><div class="field"><label for="orderId">订单号（可选）</label><input id="orderId" placeholder="例如 LD-20260812-XXXX"></div><div class="field"><label for="contact">联系方式</label><input id="contact" placeholder="邮箱、QQ 或微信号"></div><div class="field wide"><label for="message">问题说明</label><textarea id="message" maxlength="2000" placeholder="请写明需要协助的事项、发生时间和已尝试的操作。"></textarea></div></div><button id="send" class="button">提交给客服</button><p class="muted" id="status" role="status">提交后会生成工单号，并进入管理后台“售后工单”。</p><p id="created" class="ticket-created tip"></p></article></div></section></main><script>(function(){const api=window.LINGDI_API_BASE||'https://api.terradigitalpower.com';const $=s=>document.querySelector(s);$('#send').onclick=async()=>{const contact=$('#contact').value.trim(),message=$('#message').value.trim();if(!contact||!message){$('#status').textContent='请填写联系方式和问题说明。';return}$('#send').disabled=true;$('#status').textContent='正在提交…';try{const r=await fetch(api+'/api/public/tickets',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({category:$('#category').value,orderId:$('#orderId').value.trim(),contact,message})});const d=await r.json();if(!r.ok)throw new Error(d.error||'提交失败');$('#chatLog').insertAdjacentHTML('beforeend','<div class="bubble system">已收到。工单号：'+d.id+'，当前状态：'+d.status+'。客服会在后台跟进。</div>');$('#created').classList.add('show');$('#created').textContent='工单已创建：'+d.id+'。';$('#message').value='';$('#status').textContent='已提交到售后工单队列。'}catch(e){$('#status').textContent='提交失败：'+e.message}finally{$('#send').disabled=false}}})()</script></body></html>
