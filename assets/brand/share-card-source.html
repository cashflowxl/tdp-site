<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TERRA GEO square share-card source</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#050807;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}
    body{display:flex;gap:40px;padding:40px}
    .card{position:relative;isolation:isolate;width:1200px;height:1200px;flex:0 0 1200px;display:grid;place-items:center;overflow:hidden;background:#050807;color:#fff}
    .card::before{content:"";position:absolute;inset:0;z-index:-3;background:url('/assets/hero/lingdi-global-desktop-poster.jpg') 69% center/cover no-repeat;transform:scale(1.08)}
    .card::after{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 66% 45%,rgba(30,94,73,.12),transparent 40%),linear-gradient(180deg,rgba(5,8,7,.24),rgba(5,8,7,.44)),linear-gradient(90deg,rgba(5,8,7,.86),rgba(5,8,7,.24) 58%,rgba(5,8,7,.38))}
    .grid{position:absolute;inset:0;z-index:-1;opacity:.16;background-image:linear-gradient(rgba(200,255,61,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(200,255,61,.12) 1px,transparent 1px);background-size:80px 80px;mask-image:linear-gradient(135deg,transparent,#000 48%,transparent)}
    .lockup{width:70%;max-width:780px;text-align:center;filter:drop-shadow(0 12px 34px rgba(0,0,0,.62))}
    .cn-logo{display:block;width:100%;height:auto}
    .terra{display:block;font-size:132px;font-weight:860;line-height:.88;letter-spacing:-.07em}
    .byline{display:block;margin-top:28px;color:#c8ff3d;font:760 27px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.19em}
    .service{display:block;margin-top:54px;color:rgba(255,255,255,.72);font:700 19px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em}
    .signal{position:absolute;right:84px;bottom:84px;width:18px;height:18px;background:#c8ff3d;box-shadow:0 0 34px rgba(200,255,61,.55)}
  </style>
</head>
<body>
  <section class="card" id="share-cn" aria-label="领地 GEO 方形分享图">
    <div class="grid"></div>
    <div class="lockup"><img class="cn-logo" src="/lingdi-geo-logo-reverse.svg" alt="领地 GEO"></div>
    <i class="signal" aria-hidden="true"></i>
  </section>
  <section class="card" id="share-en" aria-label="TERRA GEO by Terra Digital Power square share image">
    <div class="grid"></div>
    <div class="lockup"><strong class="terra">TERRA GEO</strong><span class="byline">BY TERRA DIGITAL POWER</span><span class="service">GENERATIVE ENGINE OPTIMIZATION</span></div>
    <i class="signal" aria-hidden="true"></i>
  </section>
</body>
</html>
